<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes and IDs</title>
</head>
<body>

    <header class="site-header">
        <h1>My Website</h1>
    </header>

    <nav id="main-nav">
        <p>Main Navigation</p>
    </nav>

    <main class="content">
        <section id="about">
            <h2>About Me</h2>
            <p>This section contains information about me.</p>
        </section>
    </main>

    <footer class="site-footer">
        <p>My Website Footer</p>
    </footer>

</body>
</html>
