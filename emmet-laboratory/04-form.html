<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
    </header>

    <main>
        <form action="#" method="post">

            <label for="student-id">Student ID:</label>
            <input type="text" id="student-id" name="student-id">
            <br><br>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
            <br><br>

            <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <br><br>

            <label for="course">Course:</label>
            <select id="course" name="course">
                <option value="">Select Course</option>
                <option value="BSIT">BS Information Technology</option>
                <option value="BSCS">BS Computer Science</option>
                <option value="BSIS">BS Information Systems</option>
            </select>
            <br><br>

            <p>Hobbies:</p>
            <input type="checkbox" id="gaming" name="hobbies" value="Gaming">
            <label for="gaming">Gaming</label>

            <input type="checkbox" id="reading" name="hobbies" value="Reading">
            <label for="reading">Reading</label>

            <input type="checkbox" id="music" name="hobbies" value="Music">
            <label for="music">Music</label>

            <input type="checkbox" id="photo shooting" name="hobbies" value="Photo Shooting">
            <label for="photo shooting">Photo Shooting</label>
            <br><br>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" cols="30"></textarea>
            <br><br>

            <input type="submit" value="Register">

        </form>
    </main>

    <footer>
        <p>Student Registration Activity</p>
    </footer>

</body>
</html>
